aemo_electricity:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ':memory:'
      database: onelake
      threads: 1
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      # azure / iceberg / avro auto-install + auto-load on first use (the AZURE secret and the
      # iceberg ATTACH below trigger it) — no explicit `extensions:` needed on duckdb >= 1.5.4.
      settings:
        preserve_insertion_order: false
        # A spill directory so large aggregations spill to disk instead of OOM-killing. No
        # memory_limit — DuckDB defaults to 80% of host RAM, right for both the small CI runner and a
        # large Fabric session; hardcoding a cap here would wrongly throttle Fabric too.
        temp_directory: '/tmp/duckdb_spill'
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: onelake
          type: iceberg
          options:
            endpoint: "{{ env_var('ONELAKE_ENDPOINT') }}"
            token: "{{ env_var('ONELAKE_TOKEN') }}"
            access_delegation_mode: 'none'
            stage_create_tables: 0
            skip_create_table_metadata_updates: 1
            default_schema: dbo
