name: 'aemo_electricity'
version: '1.0.0'

profile: 'aemo_electricity'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "SET GLOBAL azure_transport_option_type = '{{ env_var('AZURE_TRANSPORT_OPTION_TYPE', 'default') }}'"

# Environment contract (set by the CI workflow / Fabric notebook / laptop shell):
#   ONELAKE_TOKEN, ONELAKE_ENDPOINT, WAREHOUSE_PATH  -> profiles.yml (Iceberg attach)
#   FILES_PATH                                       -> get_root_path/get_csv_archive_path macros
#   download_limit, process_limit                    -> staging download + fact ingestion batch size
#   AZURE_TRANSPORT_OPTION_TYPE                      -> curl on GitHub runners, default elsewhere

models:
  aemo_electricity:
    staging:
      +materialized: view
      +schema: landing
    dimensions:
      +materialized: table
      +schema: mart
    marts:
      +materialized: incremental
      +schema: landing   # raw facts; fct_summary overrides to mart (Power BI-facing)

