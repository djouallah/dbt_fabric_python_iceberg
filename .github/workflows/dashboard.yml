name: 🌐 Publish dashboard

# Publishes ONLY the dashboard, via GitHub's native Actions Pages deploy (no
# gh-pages branch, no peaceiris, no auto pages-build-deployment runner). The
# dbt pipeline (pipeline.yml) no longer touches Pages — the site is the dashboard
# and nothing else.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Deploy to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Generate runtime config
        # index.html fetches this at load time — no tenant/workspace/client GUIDs are
        # hardcoded in the repo; they live in GitHub repository variables. The client id
        # is a public SPA id (no secret), so plain variables are the right home.
        run: |
          cat > dashboard/config.json <<EOF
          {
            "workspace": "${{ vars.WS_ID }}",
            "lakehouse": "${{ vars.LH_ID }}",
            "tenant": "${{ vars.AZURE_TENANT_ID }}",
            "clientId": "${{ vars.AZURE_CLIENT_ID }}"
          }
          EOF

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
